services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-all-the-mods

    ports:
      - "25565:25565"

    environment:
      PUID: 1000
      PGID: 1000
      EULA: "TRUE"
      TYPE: "AUTO_CURSEFORGE"
      CF_SLUG: "all-the-mods-10"
      MEMORY: "12G"
      TZ: "Europe/Oslo"

    volumes:
      - /mnt/hdd/docker-volumes/game-servers/minecraft-all-the-mods:/data

    restart: unless-stopped
    stdin_open: true
    tty: true