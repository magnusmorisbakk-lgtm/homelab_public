services:
  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: whisper-server
    restart: unless-stopped
    ports:
      - "9000:8000"
    environment:
      - WHISPER_MODEL=base
      - WHISPER_INFERENCE_DEVICE=cuda
    volumes:
      - /mnt/hdd/data/ai-models/whisper-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]